databases:
  - name: dental-app-db
    databaseName: dental_app
    user: dental_app
    plan: starter

services:
  - type: web
    name: dental-app
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dental-app-db
          property: connectionString
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false